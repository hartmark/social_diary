# Runs the offline test suite (tests/run.lua against the WoW API mock) on
# every push to main and every pull request. Releases run it again before
# packaging (release.yml).

name: Tests

on:
  push:
    branches: [main, wotlk-3.3.5]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run tests
        run: luajit tests/run.lua

      - name: Test original 3.3.5 API compatibility
        run: luajit tests/legacy.lua

      - name: Test original 3.3.5 rendering adapters
        run: luajit tests/legacy_ui.lua
